<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COETA E-Cell AI</title>
    <style>
        /* Modern Glassmorphism & Liquid Aurora UI */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 350px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #fff;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-msg {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-msg {
            background: rgba(255, 255, 255, 0.2);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            font-size: 0.95rem;
        }

        button {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: #00c6ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            🚀 COETA E-Cell Assistant
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">Hello! I'm the official COETA E-Cell AI. How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask me anything..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Add user message to chat
            const userMessageDiv = document.createElement("div");
            userMessageDiv.className = "message user-msg";
            userMessageDiv.textContent = userText;
            chatBox.appendChild(userMessageDiv);
            
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Add loading indicator
            const botMessageDiv = document.createElement("div");
            botMessageDiv.className = "message bot-msg";
            botMessageDiv.textContent = "Typing...";
            chatBox.appendChild(botMessageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // THE NEW RENDER URL IS LIVE HERE
                const response = await fetch("https://coeta-ecell-api-4.onrender.com/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: userText })
                });

                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                botMessageDiv.textContent = data.reply || data.response || "I couldn't process that.";
                
            } catch (error) {
                botMessageDiv.textContent = "Oops! I cannot connect to the server right now.";
                console.error("Error:", error);
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
